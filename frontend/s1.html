<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 情报流 · 算力产业投研终端</title>

<style>
:root{
  --bg:#0B0E14; --bg2:#0E1320; --panel:#111726; --panel2:#151C2E;
  --line:#1E2638; --line2:#2A3448;
  --tx:#DEE4F0; --tx2:#8A94AC; --tx3:#5A6478;
  --amber:#F5A524; --amber-bg:rgba(245,165,36,.09);
  --good:#F0554F; --good-bg:rgba(240,85,79,.10);
  --bad:#3DBB77; --bad-bg:rgba(61,187,119,.10);
  --neu:#8A94AC; --neu-bg:rgba(138,148,172,.10);
  --us:#5B8DEF; --cn:#E5615C; --hk:#B08AE8;
  --blue:#5B8DEF;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
a{color:var(--tx);text-decoration:none}
a:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--tx3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 顶栏 ─────────────────────────── */
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1440px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-family:var(--mono);font-size:16px;letter-spacing:.5px;color:var(--amber)}
.logo span{font-size:12px;color:var(--tx2)}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;color:var(--tx2);font:inherit;font-size:13px;padding:5px 14px;border-radius:5px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--tx);font:inherit;font-size:13px;padding:7px 12px 7px 32px;outline:none}
.search input:focus{border-color:var(--line2);background:var(--panel2)}
.search input::placeholder{color:var(--tx3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--tx3);cursor:pointer;font-size:15px;padding:2px 6px;display:none}
.hnav{margin-left:auto;display:flex;gap:14px;white-space:nowrap}
.hnav a{font-size:12.5px;color:var(--tx2)}
.hnav a:hover{color:var(--tx);text-decoration:none}
.hnav a::after{content:"↗";font-size:10px;margin-left:2px;opacity:.6}
.gen{font-family:var(--mono);font-size:11px;color:var(--tx3);white-space:nowrap}

/* ── 布局 ─────────────────────────── */
.wrap{max-width:1600px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,30vw,500px);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.phd{display:flex;align-items:baseline;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.phd h3{font-size:13px;font-weight:600;letter-spacing:.3px}
.phd .sub{font-size:11px;color:var(--tx3)}
.meetcard{margin:8px 0;padding:10px 12px;border-left:3px solid var(--blue);background:var(--bg2);border-radius:4px}
.meetname{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--tx)}
.meetq{font-size:12px;line-height:1.65;color:var(--tx2);padding:6px 0;border-top:1px dashed var(--line)}
.meetq:first-of-type{border-top:0;padding-top:0}
.meetq.q1{font-weight:600;color:var(--tx)}
.meetq.q2{border-left:2px solid var(--amber);padding-left:8px}
.meetq .ql{color:var(--tx);font-weight:600}
.meetverify{display:block;margin-top:3px}
.meetverify.ok{color:#75D69B}.meetverify.warn{color:var(--amber)}.meetverify.unknown{color:var(--tx3)}
.meetlinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.meetlinks a{font-size:11.5px;color:#7EAEFF}

/* ── 徽标 / 标签 ──────────────────── */
.mk{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;width:26px;height:17px;border-radius:4px;flex:none}
.mk.US{color:var(--us);background:rgba(91,141,239,.13)}
.mk.CN{color:var(--cn);background:rgba(229,97,92,.13)}
.mk.HK{color:var(--hk);background:rgba(176,138,232,.13)}
.mk.JP{color:#38C7B1;background:rgba(56,199,177,.13)}
.mk.EU{color:var(--amber);background:var(--amber-bg)}
.tier{display:inline-flex;align-items:center;font-size:10.5px;padding:1px 7px;border-radius:4px;flex:none;font-weight:500}
.tier.重大{color:var(--amber);background:var(--amber-bg);box-shadow:inset 0 0 0 1px rgba(245,165,36,.3)}
.tier.财报{color:#6FB4FF;background:rgba(91,141,239,.12);box-shadow:inset 0 0 0 1px rgba(91,141,239,.3)}
.tier.会议{color:#B08AE8;background:rgba(176,138,232,.12)}
.tier.常规{color:var(--tx3);background:rgba(138,148,172,.08)}
.dir{display:inline-flex;font-size:10.5px;padding:1px 7px;border-radius:4px;font-weight:500;flex:none}
.dir.利好{color:var(--good);background:var(--good-bg)}
.dir.利空{color:var(--bad);background:var(--bad-bg)}
.dir.中性{color:var(--neu);background:var(--neu-bg)}

/* ── 公告流 ───────────────────────── */
.dayhd{display:flex;align-items:baseline;gap:10px;padding:14px 2px 8px;position:sticky;top:52px;background:var(--bg);z-index:10}
.dayhd .d{font-family:var(--mono);font-size:15px;font-weight:700}
.dayhd .wk{font-size:12px;color:var(--tx2)}
.dayhd .cnt{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-left:auto}
.dayhd .cnt em{font-style:normal;color:var(--amber)}
.alertbox{border:1px solid rgba(245,165,36,.35);background:linear-gradient(180deg,rgba(245,165,36,.07),rgba(245,165,36,.02));border-radius:10px;margin-bottom:8px;overflow:hidden}
.alertbox .abhd{display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:11.5px;color:var(--amber);letter-spacing:.5px;border-bottom:1px solid rgba(245,165,36,.18)}
.arow{display:flex;align-items:baseline;gap:9px;padding:8px 13px;border-bottom:1px solid rgba(245,165,36,.1)}
.arow:last-child{border-bottom:0}
.arow .co{font-weight:600;white-space:nowrap;cursor:pointer}
.arow .co:hover{color:var(--amber)}
.arow .note{color:var(--tx2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .lk{margin-left:auto;flex:none;font-size:11.5px;color:var(--tx3)}
.arow .lk:hover{color:var(--amber);text-decoration:none}
.rows{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.row{display:flex;align-items:baseline;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row .co{font-size:13px;font-weight:600;white-space:nowrap;flex:none;cursor:pointer}
.row .co:hover{color:var(--blue)}
.row .tk{font-family:var(--mono);font-size:11px;color:var(--tx3);flex:none}
.row .tt{min-width:0;flex:1;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tt a{color:inherit}
.row.dim .tt a,.row.dim .co{color:var(--tx2)}
.row .dt{font-family:var(--mono);font-size:11px;color:var(--tx3);flex:none}
.fold{width:100%;border:0;background:none;color:var(--tx3);font:inherit;font-size:12px;padding:7px;cursor:pointer;border-top:1px solid var(--line)}
.fold:hover{color:var(--tx)}
.more{display:block;width:100%;margin:16px 0 0;border:1px dashed var(--line2);background:none;color:var(--tx2);font:inherit;font-size:13px;padding:10px;border-radius:8px;cursor:pointer}
.more:hover{color:var(--tx);border-color:var(--tx3)}

/* ── 财报模块 ─────────────────────── */
table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin th{font-size:11px;font-weight:500;color:var(--tx3);text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);letter-spacing:.5px}
table.fin td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
table.fin tr:last-child td{border-bottom:0}
table.fin tr:hover td{background:var(--panel2)}
table.fin .co{font-weight:600;cursor:pointer;white-space:nowrap}
table.fin .co:hover{color:var(--blue)}
table.fin .r{text-align:right}
.filelist{display:flex;flex-direction:column;gap:3px}
.filelist a{font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px;display:block}
.filelist a:hover{color:var(--blue)}
.filelist a::before{content:"⤓ ";color:var(--tx3);font-size:11px}
.finhero{overflow:hidden}
.finintro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:linear-gradient(90deg,rgba(91,141,239,.08),rgba(245,165,36,.035))}
.finintro .lead{font-size:13px;color:var(--tx2)}
.finintro .stat{font-family:var(--mono);font-size:10.5px;color:var(--tx3);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
.ecal{padding:4px 14px 14px}
.ecday{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ecday:first-child{border-top:0}
.ecdate{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--tx);padding-top:7px}
.ecdate small{display:block;color:var(--tx3);font-size:9.5px;font-weight:500;margin-top:1px}
.ecgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.eccard{position:relative;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:9px 10px 9px 13px;cursor:pointer;overflow:hidden}
.eccard:hover{background:var(--panel2);border-color:#3A465E}
.eccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--neu)}
.eccard.US::before{background:var(--us)}.eccard.CN::before{background:var(--cn)}.eccard.HK::before{background:var(--hk)}.eccard.JP::before{background:#38C7B1}.eccard.EU::before{background:var(--amber)}
.ecname{display:flex;align-items:center;gap:7px;min-width:0}
.ecname b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ectk{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border-radius:3px;background:var(--line);padding:1px 5px;flex:none}
.ecstatus{margin-left:auto;font-size:9px;line-height:1.5;border-radius:3px;padding:1px 5px;flex:none}
.ecstatus.confirmed{color:#76D79B;background:rgba(61,187,119,.10)}
.ecstatus.estimate{color:var(--amber);background:var(--amber-bg)}
.ecstatus.history{color:#79A5FF;background:rgba(91,141,239,.12)}
.ecevent{font-size:10.5px;color:var(--tx2);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.findb{margin-top:14px;overflow:hidden}
.dbsummary{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.dbsummary span{font-family:var(--mono);font-size:10.5px;color:var(--tx3);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.dbmarket{display:flex;align-items:baseline;gap:8px;padding:12px 14px 7px}
.dbmarket b{font-size:12px}.dbmarket span{font-size:10px;color:var(--tx3)}
.dbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px;padding:0 14px 12px}
.dbcard{min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--bg2);padding:9px 10px;cursor:pointer}
.dbcard:hover{border-color:var(--line2);background:var(--panel2)}
.dbhd{display:flex;align-items:center;gap:7px}.dbhd b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dbhd .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--blue);flex:none}
.dblatest{font-size:10.5px;color:var(--tx3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anasec{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.analabel{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--amber);margin-bottom:3px}
.anatext{font-size:11.5px;color:var(--tx2);line-height:1.62}
.anaconclusion{color:var(--tx);font-weight:600}
.evidence{display:flex;flex-direction:column;gap:5px}
.evline{background:var(--bg2);border-left:2px solid var(--blue);padding:6px 7px;border-radius:3px}
.evline b{font-size:11px;color:var(--tx)}.evline span{font-size:11px;color:var(--tx2)}.evsrc{font-size:9.5px;color:var(--tx3);margin-top:2px}
.analist{padding-left:16px}.analist li{font-size:11px;color:var(--tx2);line-height:1.55;margin:2px 0}
.sourcebox{font-size:10px;color:var(--tx3);background:var(--bg2);border-radius:4px;padding:6px 7px;word-break:break-word}
.dir.待核验{color:var(--amber);background:var(--amber-bg)}

/* ── 公司档案 ─────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;margin-bottom:12px}
.back:hover{color:var(--tx);border-color:var(--line2)}
.cohd{display:flex;align-items:center;gap:14px;padding:16px;flex-wrap:wrap}
.cohd .nm{font-size:21px;font-weight:700}
.cohd .tk{font-family:var(--mono);font-size:14px;color:var(--tx2)}
.cohd .latest{margin-left:auto;display:flex;gap:22px;text-align:right}
.cohd .latest .lb{font-size:10.5px;color:var(--tx3);letter-spacing:.5px}
.cohd .latest .v{font-family:var(--mono);font-size:17px;font-weight:600}
.finrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.fincell{background:var(--panel);padding:12px 14px}
.fincell .lb{font-size:11px;color:var(--tx3);letter-spacing:.5px;display:flex;justify-content:space-between}
.fincell .lb .u{font-size:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:46px;margin:9px 0 5px}
.bars .b{flex:1;background:var(--line2);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bars .b.last{background:var(--blue)}
.bars .b.neg{background:var(--bad)}
.finvals{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--tx3)}
.finlatest{font-family:var(--mono);font-size:12px;color:var(--tx2);margin-top:6px}
.finlatest b{color:var(--tx);font-weight:600}
.secgap{margin-top:14px}
.sigrow{display:flex;align-items:baseline;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.sigrow:last-child{border-bottom:0}
.sigrow .d{font-family:var(--mono);font-size:11px;color:var(--tx3);flex:none}
.sigrow .note{color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{position:relative;padding:4px 0}
.tlrow{display:flex;gap:10px;padding:6px 14px;font-size:13px;align-items:baseline}
.tlrow .d{font-family:var(--mono);font-size:11px;color:var(--tx3);flex:none;width:78px}
.tlrow .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tlrow .tt a{color:var(--tx2)}
.tlrow .tt a:hover{color:var(--tx)}
.empty{padding:16px 14px;font-size:12.5px;color:var(--tx3)}

/* ── 多命中列表 ───────────────────── */
.hitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:12px}
.hit{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.hit:hover{border-color:var(--line2)}
.hit .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .tk{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-left:auto;flex:none}

/* ── 右栏 ─────────────────────────── */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.trgroup{padding:6px 0}
.trgroup .gt{display:flex;align-items:baseline;gap:7px;padding:7px 14px 4px;font-size:11.5px;color:var(--tx2);letter-spacing:.5px}
.trgroup .gt .hint{font-size:10.5px;color:var(--tx3);margin-left:auto}
.trow{display:flex;align-items:center;gap:9px;padding:4px 14px}
.trow .w{font-size:12.5px;width:76px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:2px;height:18px;flex:1}
.spark i{flex:1;background:var(--line2);border-radius:1px;min-height:1px}
.spark i.hot{background:var(--amber)}
.trow .n{font-family:var(--mono);font-size:11px;color:var(--tx2);width:26px;text-align:right;flex:none}
.hw{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 12px}
.hwtag{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--tx2)}
.hwtag b{color:var(--tx);font-weight:600}
.hwtag .m{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-left:5px}
.calrow{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.calrow:last-child{border-bottom:0}
.calrow .d{font-family:var(--mono);font-size:11px;flex:none;width:44px;color:var(--tx2)}
.pri{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;flex:none}
.pri.P0{color:#fff;background:var(--good)}
.pri.P1{color:#0B0E14;background:var(--amber)}
.pri.P2{color:var(--tx2);background:var(--neu-bg);box-shadow:inset 0 0 0 1px var(--line2)}
.calrow .ev{font-size:12px;color:var(--tx);min-width:0}
.calrow .ev .who{color:var(--tx2)}
/* ── 涌现页 ───────────────────────── */
.emgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.erow{padding:11px 14px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .ehd{display:flex;align-items:center;gap:9px}
.erow .ehd .spark{max-width:110px}
.erow .caret{font-size:10px;color:var(--tx3);flex:none;width:11px}
.erow .w{font-size:14px;font-weight:600}
.erow .en{font-size:10.5px;color:var(--tx3)}
.erow .tot{margin-left:auto;font-size:11px;color:var(--tx2)}
.bspark{display:flex;gap:3px;align-items:flex-end;height:40px;margin:9px 0 3px}
.bspark i{flex:1;background:var(--line2);border-radius:2px;min-height:2px}
.bspark i.hot{background:var(--amber)}
.bdates{display:flex;gap:3px;font-family:var(--mono);font-size:9px;color:var(--tx3)}
.bdates span{flex:1;text-align:center}
.tcos{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tco{font-size:11px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
.tco:hover{color:var(--tx);border-color:var(--line2)}
.tco.plain{cursor:default}
.wchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;user-select:none}
.wchip:hover{color:var(--tx);border-color:var(--line2)}
.wchip .m{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.wchip.on{color:var(--tx);border-color:rgba(245,165,36,.45);background:var(--amber-bg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.radar-wrap{overflow-x:auto}
table.radar{width:100%;min-width:920px;border-collapse:collapse;font-size:12.5px}
table.radar th{font-size:10.5px;font-weight:500;color:var(--tx3);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);letter-spacing:.35px;white-space:nowrap}
table.radar td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
table.radar tr:last-child td{border-bottom:0}
table.radar tbody tr:hover td{background:var(--panel2)}
table.radar .term{font-size:13px;font-weight:650;min-width:150px}
table.radar .r{text-align:right;white-space:nowrap}
.scorecell{min-width:116px}
.scoreline{display:flex;align-items:center;gap:8px}
.scoretrack{width:68px;height:5px;background:var(--line2);border-radius:4px;overflow:hidden}
.scoretrack i{display:block;height:100%;background:var(--amber);border-radius:4px}
.path{color:var(--tx2);white-space:nowrap}
.firstco{color:var(--tx2);cursor:pointer;white-space:nowrap}
.firstco:hover{color:var(--blue)}
.weak{color:var(--tx3)}
.srcnote{padding:8px 14px;font-size:10.5px;color:var(--tx3);border-top:1px solid var(--line);font-family:var(--mono)}

@media (min-width:1061px){
  .rail{display:flex;flex-direction:column;max-height:calc(100vh - 88px);overflow:hidden}
  .rail .panel.fill{flex:1;display:flex;flex-direction:column;min-height:220px}
  .rail .panel.fill .phd{flex:none}
}
@media (max-width:1060px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .hd{flex-wrap:wrap;height:auto;padding:8px 14px;gap:8px}
  .search{order:5;max-width:none;flex-basis:100%}
  .gen{display:none}
  .cohd .latest{margin-left:0;width:100%;text-align:left}
  .finrow{grid-template-columns:1fr 1fr}
  .emgrid{grid-template-columns:minmax(0,1fr)}
  .ecday{grid-template-columns:1fr}.ecdate{padding-top:0}.ecgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .dayhd{top:96px}
}
</style>

/* ════════════ 状态 & 数据加载 ════════════ */
var FEED = MOCK_FEED, FINF = MOCK_FINFACTS, COCACHE = {};
var LIVE = false;
var state = { module:"ann", daysShown:3, q:"", co:null };
var WK = ["周日","周一","周二","周三","周四","周五","周六"];

function fetchJSON(url){
  return fetch(url,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function loadData(){
  fetchJSON(DATA_BASE+"feed.json").then(function(j){ FEED=j; LIVE=true; render(); }).catch(function(){});
  fetchJSON(DATA_BASE+"finfacts.json").then(function(j){ FINF=j; render(); }).catch(function(){});
}
function loadCo(tk){
  if(COCACHE[tk]) return Promise.resolve(COCACHE[tk]);
  return fetchJSON(DATA_BASE+"co/"+tk+".json").then(function(j){ COCACHE[tk]=j; return j; }).catch(function(){ return null; });
}

/* ════════════ 工具 ════════════ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function wk(d){ var t=new Date(d+"T00:00:00"); return isNaN(t)?"":WK[t.getDay()]; }
function md(d){ return d? d.slice(5).replace("-","/") : ""; }
function coList(){
  var map={}, out=[];
  (FEED.cos||[]).forEach(function(c){ if(!map[c.tk]){map[c.tk]=1; out.push(c);} });
  (FEED.all||[]).forEach(function(a){ if(!map[a.tk]){map[a.tk]=1; out.push({n:a.n,tk:a.tk,m:a.m});} });
  return out;
}
function findCo(tk){ var l=coList(); for(var i=0;i<l.length;i++) if(l[i].tk===tk) return l[i]; return null; }
function matchCos(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return coList().filter(function(c){
    return c.n.toLowerCase().indexOf(q)>=0 || c.tk.toLowerCase().indexOf(q)>=0;
  });
}
function mkBadge(m){ return '<span class="mk '+esc(m)+'">'+esc(m)+'</span>'; }
function tierTag(t){ return '<span class="tier '+esc(t)+'">'+esc(t)+'</span>'; }
function dirTag(d){ return d? '<span class="dir '+esc(d)+'">'+esc(d)+'</span>':""; }

/* ════════════ 渲染：公告模块（默认维度一）════════════ */
function daysSorted(){
  return (FEED.days||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
}
function annForDay(date){
  return (FEED.all||[]).filter(function(a){ return a.d===date; });
}
function renderAnnModule(){
  var days = daysSorted().slice(0, state.daysShown);
  var h = "";
  days.forEach(function(day, di){
    var anns = annForDay(day.date);
    var tiers = day.tiers||{};
    var tierStr = Object.keys(tiers).map(function(k){ return k+" "+tiers[k]; }).join(" · ");
    h += '<div class="dayhd"><span class="d num">'+esc(day.date)+'</span><span class="wk">'+wk(day.date)+(di===0?' · 今天':'')+'</span>'
       + '<span class="cnt num">共 <em>'+(day.total||anns.length)+'</em> 条 · '+esc(tierStr)+'</span></div>';
    // 告警置顶
    var alerts = day.signals && day.signals.length ? day.signals : (day.alerts||[]);
    if(alerts.length){
      h += '<div class="alertbox"><div class="abhd">▲ 信号告警 · '+alerts.length+' 条</div>';
      alerts.forEach(function(s){
        h += '<div class="arow">'+mkBadge(s.market||mktOf(s.ticker))+dirTag(s.dir)
           + '<span class="tier 重大">'+esc(s.type)+'</span>'
           + '<span class="co" onclick="openCo(\''+esc(s.ticker)+'\')">'+esc(s.name)+'</span>'
           + '<span class="note" title="'+esc(s.title)+'">'+esc(s.note||s.title)+(s.amt?' · '+esc(s.amt):'')+'</span>'
           + (s.url?'<a class="lk" href="'+esc(s.url)+'" target="_blank" rel="noopener">原文 ↗</a>':'')
           + '</div>';
      });
      h += '</div>';
    }
    // 流水：重大在前
    anns.sort(function(a,b){
      var w=function(t){ return t==="财报"?0:t==="重大"?1:t==="会议"?2:3; };
      return w(a.tier)-w(b.tier);
    });
    var LIMIT = 20;
    var head = anns.slice(0,LIMIT), tail = anns.slice(LIMIT);
    h += '<div class="rows">';
    head.forEach(function(a){ h += annRow(a); });
    if(tail.length){
      h += '<div id="tail-'+esc(day.date)+'" style="display:none">';
      tail.forEach(function(a){ h += annRow(a); });
      h += '</div><button class="fold" onclick="toggleTail(\''+esc(day.date)+'\',this)">展开其余 '+tail.length+' 条常规 ▾</button>';
    }
    if(!anns.length) h += '<div class="empty">当日暂无公告数据'+(LIVE?'':'（mock 快照仅含近三日明细）')+'</div>';
    h += '</div>';
  });
  var total = daysSorted().length;
  if(state.daysShown < Math.max(total,(FEED.dates||[]).length)){
    h += '<button class="more" onclick="moreDays()">↓ 继续下翻更早日期</button>';
  }
  return h;
}
function annRow(a){
  return '<div class="row'+(a.tier==="常规"?" dim":"")+'">'+mkBadge(a.m)+tierTag(a.tier)
    + '<span class="co" onclick="openCo(\''+esc(a.tk)+'\')">'+esc(a.n)+'</span>'
    + '<span class="tk num">'+esc(a.tk)+'</span>'
    + '<span class="tt"><a href="'+esc(a.url)+'" target="_blank" rel="noopener" title="'+esc(a.t)+'">'+esc(a.t)+'</a></span>'
    + '<span class="dt num">'+md(a.d)+'</span></div>';
}
function mktOf(tk){ var c=findCo(tk); return c?c.m:""; }
function toggleTail(date,btn){
  var el=document.getElementById("tail-"+date);
  var open = el.style.display!=="none";
  el.style.display = open?"none":"block";
  btn.textContent = open? btn.textContent.replace("收起","展开其余").replace("▴","▾") : "收起常规公告 ▴";
  if(!open) btn.textContent="收起常规公告 ▴";
}
function moreDays(){ state.daysShown += 3; render(); }

/* ════════════ 渲染：财报模块 ════════════ */
function finByCo(){
  if(FEED.fin_by_co && FEED.fin_by_co.length) return FEED.fin_by_co;
  return MOCK_FEED.fin_by_co;
}
function finSpark(vals){
  var max = Math.max.apply(null, vals.map(Math.abs).concat([0.001]));
  return '<div class="spark" style="height:26px;width:86px;flex:none">'+vals.map(function(v,i){
    return '<i style="height:'+Math.max(6,Math.round(Math.abs(v)/max*100))+'%'+(i===vals.length-1?';background:var(--blue)':'')+'" title="'+v+' 亿"></i>';
  }).join("")+'</div>';
}
function isFinEvent(e){ return /财报|决算|业绩|Q[1-4]|FY/i.test(e.event||""); }
function finMarketLabel(m){ return {US:"美股",CN:"A股",HK:"港股",JP:"日股",EU:"欧洲"}[m]||m||"其他"; }
function finCatalog(){
  if(FEED.fin_catalog && FEED.fin_catalog.length) return FEED.fin_catalog;
  var map={};
  (FEED.fin_recent||[]).forEach(function(a){
    var x=map[a.tk]||(map[a.tk]={n:a.n,tk:a.tk,m:a.m,count:0,latest:{}}); x.count++;
    if(!x.latest.d||a.d>x.latest.d) x.latest={d:a.d,t:a.t,url:a.url};
  });
  return Object.keys(map).map(function(k){return map[k];});
}

function trendCoChips(cos){
  if(!cos||!cos.length) return "";
  return '<div class="tcos">'+cos.map(function(n){
    var c=coList().filter(function(x){return x.n===n;})[0];
    return c? '<span class="tco" onclick="openCo(\''+esc(c.tk)+'\')">'+esc(n)+'</span>'
            : '<span class="tco plain">'+esc(n)+'</span>';
  }).join("")+'</div>';
}
function bigSpark(seq){
  var max=Math.max.apply(null,seq.concat([1]));
  var dates=FEED.dates||[];
  var bars='<div class="bspark">'+seq.map(function(v,i){
    return '<i style="height:'+Math.max(4,Math.round(v/max*100))+'%"'+(v>0&&i>=seq.length-2?' class="hot"':'')+' title="'+(dates[i]||'')+' · '+v+' 次"></i>';
  }).join("")+'</div>';
  var lbls='<div class="bdates">'+seq.map(function(v,i){
    return '<span>'+(dates[i]? dates[i].slice(8):'')+'</span>';
  }).join("")+'</div>';
  return bars+lbls;
}
var EMG_COLORS=["#F5A524","#5B8DEF","#F0554F","#3DBB77","#B08AE8","#6FB4FF","#E5615C","#8A94AC"];
var emgSel=null; // null = 默认选频次 Top3
function emgWords(){
  var out=[];
  ["玲姐尺","前哨尺"].forEach(function(k){ ((FEED.trends||{})[k]||[]).forEach(function(t){ out.push({g:k,key:k+"|"+t.w,w:t.w,seq:t.seq||[],total:t.total||0,cos:t.cos||[]}); }); });
  return out;
}
function curSel(){
  if(emgSel===null){
    emgSel = emgWords().sort(function(a,b){ return b.total-a.total; }).slice(0,3).map(function(t){ return t.key; });
  }
  return emgSel;
}
function toggleSel(key){
  var s=curSel(), i=s.indexOf(key);
  if(i>=0) s.splice(i,1); else s.push(key);
  render();
}
function emgWordMatch(q){
  return emgWords().filter(function(t){ return t.w.toLowerCase().indexOf(q)>=0; }).length
       + (FEED.hotwords||[]).filter(function(w){ return w.w.toLowerCase().indexOf(q)>=0; }).length;
}
function trendChart(sel){
  var dates=FEED.dates||[];
  var n=Math.max(dates.length, sel.length? sel[0].seq.length:0, 2);
  var W=780,H=210,L=34,R=14,T=14,B=26;
  var max=1; sel.forEach(function(t){ t.seq.forEach(function(v){ if(v>max)max=v; }); });
  function x(i){ return L+(W-L-R)*(i/(n-1)); }
  function y(v){ return T+(H-T-B)*(1-v/max); }
  var h='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  [0,Math.round(max/2),max].forEach(function(v){
    h+='<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="#1E2638" stroke-width="1"/>'
     +'<text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5A6478">'+v+'</text>';
  });
  for(var i=0;i<n;i++){
    var d=dates[i]||"";
    h+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5A6478">'+esc(d.slice(5))+'</text>';
  }
  sel.forEach(function(t,si){
    var col=EMG_COLORS[si%EMG_COLORS.length];
    var pts=t.seq.map(function(v,i){ return x(i)+','+y(v); }).join(' ');
    h+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>';
    t.seq.forEach(function(v,i){
      h+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+col+'"><title>'+esc(t.w)+' · '+esc(dates[i]||'')+' · '+v+' 次</title></circle>';
    });
  });
  return h+'</svg>';
}

/* ════════════ 渲染：公司档案（维度二）════════════ */
function openCo(tk){
  state.co = tk; state.q = "";
  var input=document.getElementById("q");
  var c=findCo(tk); input.value = c? c.n : tk;
  document.getElementById("qclr").style.display="block";
  render();
  window.scrollTo(0,0);
  loadCo(tk).then(function(j){ if(j && state.co===tk) render(); });
}
function backHome(){ state.co=null; clearSearch(); }
function sigsFor(tk){
  var out=[];
  (FEED.days||[]).forEach(function(d){
    (d.signals||[]).forEach(function(s){ if(s.ticker===tk) out.push(Object.assign({date:d.date},s)); });
  });
  out.sort(function(a,b){ return a.date<b.date?1:-1; });
  return out;
}
function miniBars(vals, unit, isPct){
  var max = Math.max.apply(null, vals.map(Math.abs).concat([0.001]));
  var h = '<div class="bars">';
  vals.forEach(function(v,i){
    var pct = Math.max(4, Math.round(Math.abs(v)/max*100));
    h += '<div class="b'+(i===vals.length-1?" last":"")+(v<0?" neg":"")+'" style="height:'+pct+'%" title="'+v+(isPct?"%":unit)+'"></div>';
  });
  return h+'</div>';
}
function renderCoView(){

  var f = FINF[tk];
  var codata = COCACHE[tk];
  var h = '<button class="back" onclick="backHome()">← 返回情报流</button>';

  // 头卡 + 财务

     + mkBadge(c.m)+'<span class="nm">'+esc(c.n)+'</span><span class="tk">'+esc(c.tk)+'</span>';
  var cu = (f&&f.cur)||"亿元";  // 币种口径: A股亿元/美股亿美元/港股亿港元(报告货币统一铁律)
  if(f && f.latest){
    var latestLb = /^FY/.test(String(f.latest.date||"")) ? "最新年度" : "最新一季";
    h += '<div class="latest"><div><div class="lb">'+latestLb+'营收</div><div class="v">'+f.latest.rev+' <span style="font-size:11px;color:var(--tx3)">'+cu+'</span></div></div>'
       + '<div><div class="lb">'+latestLb+'归母净利</div><div class="v">'+f.latest.np+' <span style="font-size:11px;color:var(--tx3)">'+cu+'</span></div></div>'
       + '<div><div class="lb">截至</div><div class="v" style="font-size:13px;color:var(--tx2)">'+esc(f.latest.date)+'</div></div></div>';
  }
  h += '</div>';
  if(f){
    // 表格+趋势(七看核心指标): 原始4项 + 营收增速YoY/净利率/ROE/经营现金流/含金量(Owner定案 2026-07-16)
    var yrs = f.years||[];
    function _yoy(a){ a=a||[]; var o=[null]; for(var i=1;i<a.length;i++){ o.push((a[i]!=null&&a[i-1])?Math.round((a[i]/a[i-1]-1)*1000)/10:null); } return o; }
    function _rt(a,b){ return (a||[]).map(function(v,i){ var d=(b||[])[i]; return (v!=null&&d)?Math.round(v/d*1000)/10:null; }); }
    function _gd(a,b){ return (a||[]).map(function(v,i){ var d=(b||[])[i]; return (v!=null&&d)?Math.round(v/d*100)/100:null; }); }
    var finrows = [
      {lb:"营收", u:cu, vals:f.rev},
      {lb:"营收增速", u:"%", vals:_yoy(f.rev), warnNeg:1},
      {lb:"归母净利", u:cu, vals:f.np, warnNeg:1},
      {lb:"净利率", u:"%", vals:_rt(f.np,f.rev), warnNeg:1},
      {lb:"毛利率", u:"%", vals:f.gm},
      {lb:"ROE", u:"%", vals:f.roe, warnNeg:1},
      {lb:"经营现金流", u:cu, vals:f.ocf, warnNeg:1},
      {lb:"现金含金量", u:"×", vals:_gd(f.ocf,f.np), warnLow1:1},
      {lb:"资本开支", u:cu, vals:f.capex}
    ];
    function _spark(vals){
      var pts=[]; (vals||[]).forEach(function(v,i){ if(v!=null) pts.push([i,v]); });
      if(pts.length<2) return '';
      var ys=pts.map(function(p){return p[1];});
      var mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys), rg=(mx-mn)||1, W=60, H=16, N=(vals.length-1)||1;
      var d=pts.map(function(p){ return Math.round(p[0]/N*W)+','+(H-2-Math.round((p[1]-mn)/rg*(H-4))); }).join(' ');
      var up=ys[ys.length-1]>=ys[0];

function sparkline(seq){
  var max = Math.max.apply(null, seq.concat([1]));
  var hotIdx = seq.lastIndexOf(Math.max.apply(null,seq));
  return '<div class="spark">'+seq.map(function(v,i){
    return '<i style="height:'+Math.max(6,Math.round(v/max*100))+'%"'+(v>0&&i>=seq.length-2?' class="hot"':'')+'></i>';
  }).join("")+'</div>';
}
function cleanMeetingMd(s){
  return String(s||'').replace(/^\s*>\s?/gm,'').replace(/\*\*/g,'').replace(/^\s*[-*]\s+/gm,'').trim();
}
function meetingThreeQ(body){
  var out={q1:[],q2:[],q3:[]}, cur='';
  String(body||'').split(/\n/).forEach(function(line){
    var x=line.replace(/^\s*>\s?/,'').replace(/^\s*[-*]\s+/,'').trim();
    if(/^\*{0,2}①\s*重大发现/.test(x)){cur='q1'; x=x.replace(/^\*{0,2}①\s*重大发现(?:\s*\+\s*来源)?\*{0,2}\s*[：:]?\s*/,'');}
    else if(/^\*{0,2}②\s*指向什么/.test(x)){cur='q2'; x=x.replace(/^\*{0,2}②\s*指向什么(?:\s*\/\s*可能方向)?\*{0,2}\s*[：:]?\s*/,'');}
    else if(/^\*{0,2}③\s*数据能不能对上/.test(x)){cur='q3'; x=x.replace(/^\*{0,2}③\s*数据能不能对上\*{0,2}\s*[：:]?\s*/,'');}
    if(cur && x && !/^🎧\s*原声|^media_url\s*[:：]/i.test(x)) out[cur].push(cleanMeetingMd(x));
  });
  out.structured=!!(out.q1.length&&out.q2.length&&out.q3.length);
  return out;
}
function meetingMediaLink(body){
  var s=String(body||''), m=s.match(/(?:🎧\s*原声|media_url)\s*[：:]\s*(?:\[[^\]]*\]\()?<?(https?:\/\/[^\s)>`]+)/i);
  return m?m[1].replace(/[.,，。]+$/,''):'';
}
function renderVerify(text){
  var lines=cleanMeetingMd(text).split(/\n+/).filter(Boolean);
  return lines.map(function(line){
    var c=/^✅/.test(line)?'ok':/^⚠️/.test(line)?'warn':/^❓/.test(line)?'unknown':'';
    return '<span class="meetverify '+c+'">'+esc(line)+'</span>';
  }).join('');
}

  var q=meetingThreeQ(body), audio=meetingMediaLink(body), h='';

      ? briefs.length+' 条 · 结论—证据—影响—风险 · 重要财报触发投研底稿更新(人审)'
      : briefs.length+' 条累积 · 逐条分析为什么 · 新的在上、历史一直保留 · 结论以原文为准';
    h += '<div class="panel fill"><div class="phd"><h3>'+railTitle+'</h3><span class="sub">'+railSub+'</span></div>'
       + '<div style="padding:8px 10px;flex:1;min-height:0;overflow-y:auto">';
    pend.forEach(function(sg){
      var reason = BRIEF_REASON[sg.type] || "该类事件方向取决于具体条款,以原文为准。";
      h += '<div style="border:1px dashed var(--line);border-radius:7px;padding:9px 11px;margin:7px 0;opacity:.85">'
         + briefChipRow(sg.date||today, sg.market, sg.dir, sg.type, sg.ticker, sg.name)
         + '<div style="font-size:12px;color:var(--tx2);line-height:1.5;margin-bottom:5px">'+esc(sg.note&&sg.note!==sg.title?sg.note:(sg.title||""))+'</div>'
         + '<div style="font-size:11.5px;color:var(--tx3);line-height:1.6;border-top:1px dashed var(--line);padding-top:5px">→ '+esc(reason)+'</div>'
         + '<div style="margin-top:4px;font-size:10.5px;color:var(--amber)">⏳ 深度分析下一班生成(每日 07:00 / 19:30)</div>'
         + (sg.url?'<div style="margin-top:3px"><a class="lk" href="'+esc(sg.url)+'" target="_blank" rel="noopener" style="font-size:11px">原文 ↗</a></div>':'')
         + '</div>';
    });
    var lastD = "";
    briefs.forEach(function(b){
      if(b.d !== lastD){
        lastD = b.d;
        h += '<div style="display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;padding:4px 2px;border-bottom:1px solid var(--line)"><span class="num" style="font-size:13px;font-weight:700">'+esc(b.d)+'</span><span style="font-size:11px;color:var(--tx2)">'+wk(b.d)+'</span></div>';
      }
      var detail = b.analysis_schema>=2 && b.analysis ? renderStructuredAnalysis(b)
        : '<div class="anasec"><div class="analabel">旧版解读</div><div class="anatext" style="white-space:pre-wrap">'+esc(b.brief||"")+'</div></div>';
      h += '<div style="border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:7px 0">'
         + briefChipRow(b.d, b.m, b.dir, b.type, b.tk, b.n)
         + '<div style="font-size:12px;color:var(--tx2);line-height:1.5;margin-bottom:6px;font-weight:600">'+esc(b.t||"")+'</div>'
         + detail
         + '<div style="margin-top:5px;display:flex;gap:10px;align-items:center">'
         + (b.url?'<a class="lk" href="'+esc(b.url)+'" target="_blank" rel="noopener" style="font-size:11px">原文 ↗</a>':'')
         + '<span style="font-size:10px;color:var(--tx3)">分析生成 '+esc(b.gen_at||"")+'</span></div>'
         + '</div>';
    });
    h += '</div></div>';
    return h;
  }
  // 财报栏空态:不落公告模板,给专属提示(新财报披露后 briefs 自动生成)
  if(state.module === "fin"){
    return '<div class="panel"><div class="phd"><h3>财报解读</h3><span class="sub">核心结论 · 财报证据 · 影响 · 风险</span></div>'
         + '<div class="empty" style="padding:14px">暂无财报解读 —— 下一份财报披露后自动生成(每日 07:00 / 19:30 两班)。7 月 28 日起微软/谷歌/亚马逊集中披露,届时此栏点亮。</div></div>';
  }
  // 兜底:briefs 尚未生成时维持 v1 模板卡片
  var cards = briefCards();
  h = '<div class="panel"><div class="phd"><h3>解读</h3><span class="sub">'+cards.length+' 条 · 近 '+Math.min(state.daysShown,(FEED.days||[]).length)+' 天利空/利好/中性与重大公告 · 滚动查看 · 结论以原文为准</span></div>';
  if(!cards.length){ h += '<div class="empty">近期无信号/重大公告</div></div>'; return h; }
  h += '<div style="padding:8px 10px;max-height:72vh;overflow-y:auto">';
  cards.forEach(function(c){
    var sg = c.s;
    var reason = BRIEF_REASON[sg.type] || "该类事件方向取决于具体条款,以原文为准。";
    var fact = sg.note && sg.note !== sg.title ? sg.note : (sg.title||"");
    h += '<div style="border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin:7px 0">'
       + briefChipRow(c.d, sg.market, sg.dir, sg.type, sg.ticker, sg.name)
       + '<div style="font-size:12px;color:var(--tx2);line-height:1.5;margin-bottom:5px">'+esc(fact)+(sg.amt?' · '+esc(sg.amt):'')+'</div>'
       + '<div style="font-size:11.5px;color:var(--tx3);line-height:1.6;border-top:1px dashed var(--line);padding-top:5px">→ '+esc(reason)+'</div>'
       + (sg.url?'<div style="margin-top:4px"><a class="lk" href="'+esc(sg.url)+'" target="_blank" rel="noopener" style="font-size:11px">原文 ↗</a></div>':'')
       + '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderRail(){
  // 2026-07-23 重排(CEO意见①③④):公告页侧栏=简读+公告类时间节点;
  // 涌现速览撤除(涌现自己看);会议原声升级为独立 tab;财报日历已在财报页「即将披露」
  var h = "";
  if(state.module === "ann" && !state.co){
    h += renderBriefRail();
    var isFin = function(e){ return /财报|决算|业绩|Q[1-4]|FY/i.test(e.event||""); };
    var cal = (FEED.calendar||[]).filter(function(e){ return !isFin(e); })
              .sort(function(a,b){ return a.date>b.date?1:-1; });
    h += '<div class="panel"><div class="phd"><h3>时间节点</h3><span class="sub">未来 3 周 · 仅公告类事件(财报日历见「财报」页)</span></div>';
    if(cal.length){
      cal.forEach(function(e){
        h += '<div class="calrow"><span class="d num">'+md(e.date)+'</span><span class="pri '+esc(e.pri)+'">'+esc(e.pri)+'</span>'
           + '<span class="ev"><span class="who">'+esc(e.name)+'</span> · '+esc(e.event)+'</span></div>';
      });
    } else {
      h += '<div class="empty" style="padding:10px">近三周暂无公告类关键事件</div>';
    }
    h += '<div class="srcnote">'+(LIVE?'LIVE · '+esc(FEED.generated):'MOCK 快照 · '+esc(FEED.generated))+'</div></div>';
  } else if(state.module === "fin" && !state.co){
    // 财报页右栏只保留待分析内容；未agent报日历已经移到主区顶部。
    h += renderBriefRail();
  } else if(state.module === "meet" && !state.co){
    // 电话会议页右栏:即将的业绩会/电话会日历(方式与财报一致)
    var isCallEv = function(e){ return /财报|决算|业绩|电话会|说明会|Q[1-4]|FY/i.test(e.event||""); };
    var mcal = (FEED.calendar||[]).filter(isCallEv).sort(function(a,b){ return a.date>b.date?1:-1; });
    h += '<div class="panel"><div class="phd"><h3>时间节点</h3><span class="sub">未来 3 周 · 即将召开的业绩会/电话会</span></div>';
    if(mcal.length){
      mcal.forEach(function(e){
        h += '<div class="calrow"><span class="d num">'+md(e.date)+'</span><span class="pri '+esc(e.pri)+'">'+esc(e.pri)+'</span>'
           + '<span class="ev"><span class="who">'+esc(e.name)+'</span> · '+esc(e.event)+'</span></div>';
      });
    } else { h += '<div class="empty" style="padding:10px">近三周暂无会议日历</div>'; }
    h += '<div class="srcnote">'+(LIVE?'LIVE · '+esc(FEED.generated):'MOCK · '+esc(FEED.generated))+'</div></div>';
  } else {
    h += '<div class="panel"><div class="srcnote">'+(LIVE?'LIVE · '+esc(FEED.generated):'MOCK 快照 · '+esc(FEED.generated))+'</div></div>';
  }
  return h;
}

/* ════════════ 主渲染 ════════════ */
function render(){
  var main = document.getElementById("main");
  document.getElementById("gen").textContent = (LIVE?"● LIVE ":"○ MOCK ")+ (FEED.generated||"");
  document.getElementById("gen").style.color = LIVE? "var(--bad)":"var(--tx3)";
  if(state.co){
    main.innerHTML = renderCoView();
  } else if(state.q.trim()){
    var qq = state.q.trim().toLowerCase();
    var hits = matchCos(state.q);
    if(state.module==="emg" && emgWordMatch(qq)>0){
      main.innerHTML = renderEmgModule(qq, hits);
    }
    else if(hits.length===1){ state.co = hits[0].tk; main.innerHTML = renderCoView(); loadCo(hits[0].tk).then(function(j){ if(j) render(); }); }
    else if(hits.length===0){ main.innerHTML = '<div class="panel"><div class="empty">无匹配'+(state.module==="emg"?'词语或':'')+'公司：“'+esc(state.q)+'” · 覆盖 '+coList().length+' 家算力产业链公司</div></div>'; }
    else main.innerHTML = renderHits(hits);
  } else {
    main.innerHTML = state.module==="ann" ? renderAnnModule() : state.module==="fin" ? renderFinModule() : state.module==="meet" ? renderMeetModule() : renderEmgModule();
  }
  document.getElementById("rail").innerHTML = renderRail();
  document.getElementById("tabAnn").className = state.module==="ann"&&!state.co&&!state.q?"on":"";
  document.getElementById("tabFin").className = state.module==="fin"&&!state.co&&!state.q?"on":"";
  document.getElementById("tabMeet").className = state.module==="meet"&&!state.co&&!state.q?"on":"";
  document.getElementById("tabEmg").className = state.module==="emg"&&!state.co?"on":"";
}
function setModule(m){ state.module=m; state.co=null; state.q=""; syncSearch();
  document.getElementById("q").placeholder = m==="emg"? "筛选词语 / 公司名 / 代码…" : "搜公司名 / 代码 → 直达公司档案";
  render(); }
function clearSearch(){ state.q=""; state.co=null; syncSearch(); render(); }
function syncSearch(){
  var i=document.getElementById("q"); i.value=state.q;
  document.getElementById("qclr").style.display = state.q?"block":"none";
}

document.getElementById("q").addEventListener("input", function(e){
  state.q = e.target.value; state.co = null;
  document.getElementById("qclr").style.display = state.q?"block":"none";
  render();
});
document.getElementById("q").addEventListener("keydown", function(e){
  if(e.key==="Escape") clearSearch();
});

render();
loadData();
</script>
